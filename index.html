<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja de Livros</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section id="contato">
        <form>
            <p></p>

            <p>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
            </p>

            <p>
                <label for="genero-favorito">Gênero Literário Favorito:</label><br>
                <select id="genero-favorito" name="genero-favorito">
                    <option value="fantasia">Fantasia</option>
                    <option value="ficcao">Ficção Científica</option>
                    <option value="romance">Romance</option>
                    <option value="biografia">Biografia</option>
                    <option value="outros">Outros</option>
                </select>
            </p>

            <p>
                <button type="submit">Cadastrar</button>
            </p>
        </form>
    </section>

    <hr>

    <footer>
        <p>&copy; 2026 Livraria Ponto do Livro. Todos os direitos reservados.</p>
        <p>Atendimento: contato@pontodolivro.com.br</p>
    </footer>
</body>
</html>v
